# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Group related packages to prevent partial upgrades that break builds
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-three:
        patterns:
          - "@react-three/*"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are gated on Next.js compiler-API support.
      # TS 7 broke prod on 2026-07-28 (PR #161) because Next.js 16.2.x
      # doesn't provide the required compiler API. Re-enable after
      # confirming Next.js official TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
